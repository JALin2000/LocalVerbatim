name: Source checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check source contents and documentation links
        run: python3 -B scripts/check_source_release.py .
      - name: Check Python syntax without importing dependencies
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/localverbatim-pycache
        run: python3 -m compileall -q engine scripts tests
